<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>
   <form method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Name" required>
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Email" required>
        <br>
        <input type="radio" id="gender-m" name="gender" value="male" required>
        <label for="gender-m">Male</label>
        <input type="radio" id="gender-f" name="gender" value="female" required>
        <label for="gender-f">Female</label>
        <br>
        <label for="cars">Car Brands</label>
        <select id="cars">
            <option value="bmw">BMW</option>
            <option value="audi">Audi</option>
            <option value="mercedes">Mercedes</option>

        </select>
        <br>
        <label for="carage">Car Age:</label>
        <input type="number" id="carage" placeholder="Age" required>
        <br>
        <label for="dop">Date of Purchase:</label>
        <input type="date" id="dop" required>
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Password" required>
        <br>
        <input type="submit" value="Submit">
    </form>
</body>

</html>
